# ============================================================================
#  PUBLICAR UNA VERSION NUEVA DEL KIOSCO
# ============================================================================
#
#  Al subir una etiqueta de version (por ejemplo `v0.2.0`), GitHub arma el
#  instalador en una maquina Windows y lo publica en el repositorio PUBLICO de
#  versiones de su ambiente. Los kioscos de ese ambiente lo descargan solos y
#  lo instalan de madrugada (ver apps/kiosco-main/src/actualizaciones.ts).
#
#  ¿A QUE REPOSITORIO? Lo decide AMBIENTE en packages/compartido/src/
#  configuracion.ts, la misma palabra que decide la base de datos:
#     'pruebas'    -> cuenta-del-sistema/versiones-kiosco-pruebas
#     'produccion' -> cuenta-del-sistema/versiones-kiosco
#  Nadie elige a mano, asi que no se puede equivocar.
#
#  ¿POR QUE OTRO REPOSITORIO Y PUBLICO? Este (el del codigo) es privado, y un
#  kiosco no puede descargar de uno privado sin una contraseña dentro del .exe,
#  que dejaria de ser secreta (CLAUDE.md 3.2). El de versiones solo tiene
#  instaladores, que no llevan nada secreto.
#
#  Necesita UN secreto: TOKEN_VERSIONES, un token de GitHub con permiso de
#  escribir en los dos repositorios de versiones. Como crearlo: manual tecnico,
#  "Publicar una version nueva del kiosco".
#
#  Como sacar una version nueva:
#    1. Cambiar "version" en apps/kiosco-main/package.json (ej. 0.2.0).
#    2. git commit -am "Version 0.2.0"  &&  git tag v0.2.0  &&  git push --tags
#    3. Esperar ~10 minutos: Actions -> "Instalador del kiosco".
#    4. Los kioscos la bajan en las siguientes horas y la instalan de
#       madrugada. Para instalarla YA en uno: modo administrador -> "Instalar
#       la version nueva".

name: Instalador del kiosco

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  instalador:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: La etiqueta coincide con la version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/kiosco-main/package.json').version")
          if [ "v$version" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::La etiqueta es ${GITHUB_REF_NAME} pero apps/kiosco-main/package.json dice $version. Deben ser iguales."
            exit 1
          fi

      - name: Ambiente y repositorio de versiones
        id: ambiente
        shell: bash
        run: |
          ambiente=$(sed -n "s/^export const AMBIENTE: .* = '\(pruebas\|produccion\)';.*/\1/p" packages/compartido/src/configuracion.ts)
          case "$ambiente" in
            pruebas)    repo=versiones-kiosco-pruebas ;;
            produccion) repo=versiones-kiosco ;;
            *) echo "::error::No se pudo leer AMBIENTE en configuracion.ts"; exit 1 ;;
          esac
          echo "Ambiente: $ambiente -> cuenta-del-sistema/$repo"
          echo "repo=$repo" >> "$GITHUB_OUTPUT"

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos
        run: npm run revisar-tipos

      # Electron 44 ya no descarga sus archivos al hacer `npm ci`: lo hace la
      # primera vez que se ejecuta. En esta maquina nunca se ejecuto, y
      # electron-builder (electronDist en electron-builder.yml) no los
      # encontraba (se vio el 28-09-2026 con v0.1.7).
      - name: Descargar los archivos de Electron
        run: node node_modules/electron/install.js

      # El repositorio se escribe en electron-builder.yml y no se pasa como
      # `-c.publish.repo=...`: en Windows, npm parte ese parametro en dos y
      # electron-builder lo toma como el nombre de un archivo (se vio el
      # 28-09-2026 con v0.1.6).
      - name: Apuntar la publicacion al repositorio del ambiente
        shell: bash
        run: |
          sed -i "s/^  repo: .*/  repo: ${{ steps.ambiente.outputs.repo }}/" apps/kiosco-main/electron-builder.yml
          grep -n "^  repo:" apps/kiosco-main/electron-builder.yml

      # Armar SIN publicar. electron-builder sabe publicar solo, pero sube el
      # .exe y el .blockmap al mismo tiempo y cada uno intenta crear el
      # Release: el segundo choca ("Published releases must have a valid
      # tag") y nunca sube latest.yml (se vio el 28-09-2026 con v0.1.7).
      # La seccion publish del yml igual hace que se genere latest.yml.
      - name: Armar el instalador
        run: npm run empaquetar --workspace=@kiosko/kiosco-main -- --publish never

      # Publicar los tres archivos de una vez. Si el Release ya existe (por
      # ejemplo, quedo a medias en un intento anterior), se completa.
      - name: Publicar en el repositorio de versiones
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.TOKEN_VERSIONES }}
        run: |
          repo="cuenta-del-sistema/${{ steps.ambiente.outputs.repo }}"
          version=$(node -p "require('./apps/kiosco-main/package.json').version")
          cd apps/kiosco-main/dist-instalador
          archivos="ControlDeAsistencia-Instalador-$version.exe ControlDeAsistencia-Instalador-$version.exe.blockmap latest.yml"
          ls -la $archivos
          if gh release view "v$version" --repo "$repo" > /dev/null 2>&1; then
            gh release upload "v$version" $archivos --repo "$repo" --clobber
          else
            gh release create "v$version" $archivos --repo "$repo" --title "$version" \
              --notes "Version $version del kiosco. Los kioscos la descargan solos y la instalan de madrugada."
          fi
          gh release view "v$version" --repo "$repo"

      - name: Guardarlo tambien como artifact
        uses: actions/upload-artifact@v4
        with:
          name: instalador-kiosco
          path: |
            apps/kiosco-main/dist-instalador/*.exe
            apps/kiosco-main/dist-instalador/latest.yml
          retention-days: 30
