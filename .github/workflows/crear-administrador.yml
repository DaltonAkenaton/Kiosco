# ============================================================================
#  CREAR UN ADMINISTRADOR DEL PANEL (el primero, o si nadie puede entrar)
# ============================================================================
#
#  Un proyecto nuevo de Supabase (produccion) nace sin nadie que pueda entrar
#  al panel, y el panel no deja registrarse a nadie solo. Este boton crea la
#  primera cuenta de administrador. De ahi en adelante, los demas accesos se
#  dan desde el panel (Accesos).
#
#  Tambien sirve de "llave maestra" si todos los administradores olvidaron su
#  contrasena: con el mismo correo, le pone una contrasena temporal nueva.
#
#  COMO: Actions -> "Crear administrador" -> Run workflow -> correo y nombre.
#  La contrasena TEMPORAL aparece en el RESUMEN de la corrida (arriba, al
#  abrirla), nunca en el registro de pasos. Entra al panel de inmediato: al
#  cambiarla, la temporal deja de servir. Despues se puede borrar la corrida.
#
#  Hace lo mismo que `npm run supabase:primer-admin`, pero sin copiar la llave
#  secreta de Supabase a ninguna computadora: la pide aqui a la API de
#  Supabase con SUPABASE_ACCESS_TOKEN y solo vive mientras corre.

name: Crear administrador

on:
  workflow_dispatch:
    inputs:
      correo:
        description: 'Correo con el que va a entrar'
        required: true
        type: string
      nombre:
        description: 'Nombre completo'
        required: true
        type: string
      proyecto:
        description: 'Proyecto'
        required: true
        default: segun-ambiente
        type: choice
        options:
          - segun-ambiente
          - pruebas
          - produccion

permissions:
  contents: read

env:
  SUBDOMINIO_CLOUDFLARE: mi-cuenta

jobs:
  crear:
    # Solo en el repositorio real: la copia de portafolio no tiene esta variable
    # ni los secretos, asi que el trabajo se salta (gris) en lugar de fallar.
    if: vars.DESPLIEGUE_ACTIVO == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Crear la cuenta
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF_PRUEBAS: ${{ secrets.SUPABASE_REF_PRUEBAS }}
          REF_PRODUCCION: ${{ secrets.SUPABASE_REF_PRODUCCION }}
          ELEGIDO: ${{ inputs.proyecto }}
          CORREO_ADMIN: ${{ inputs.correo }}
          NOMBRE_ADMIN: ${{ inputs.nombre }}
        run: |
          ambiente=$(sed -n "s/^export const AMBIENTE: .* = '\(pruebas\|produccion\)';.*/\1/p" packages/compartido/src/configuracion.ts)
          destino="$ELEGIDO"
          [ "$destino" = "segun-ambiente" ] && destino="$ambiente"
          case "$destino" in
            pruebas)    ref="$REF_PRUEBAS" ;;
            produccion) ref="$REF_PRODUCCION" ;;
            *) echo "::error::No se pudo leer AMBIENTE en configuracion.ts"; exit 1 ;;
          esac
          if [ -z "$ref" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Faltan los secretos de Supabase (ver 'Publicar en Supabase')."
            exit 1
          fi

          # La llave SECRETA, solo para esta corrida. `::add-mask::` la tapa
          # en el registro por si algo la llegara a imprimir.
          secreta=$(curl -sf -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$ref/api-keys?reveal=true" | node -e '
              let d = ""; process.stdin.on("data", (c) => (d += c)).on("end", () => {
                const llaves = JSON.parse(d);
                const k = llaves.find((x) => x.name === "service_role") ?? llaves.find((x) => x.type === "secret");
                process.stdout.write(k?.api_key ?? "");
              });')
          if [ -z "$secreta" ]; then
            echo "::error::No se pudo obtener la llave secreta de Supabase ($destino). Revisa SUPABASE_ACCESS_TOKEN."
            exit 1
          fi
          echo "::add-mask::$secreta"

          # En produccion el panel es `panel`; en pruebas, mientras no se
          # encienda produccion, tambien. Despues, `panel-pruebas`.
          if [ "$destino" = "pruebas" ] && [ "$ambiente" = "produccion" ]; then
            sitio=panel-pruebas
          else
            sitio=panel
          fi

          echo "Proyecto: $destino"
          SUPABASE_URL="https://$ref.supabase.co" SUPABASE_LLAVE_SECRETA="$secreta" \
            PANEL_URL="https://$sitio.$SUBDOMINIO_CLOUDFLARE.workers.dev" \
            node supabase/primer-administrador.mjs < /dev/null
