# ============================================================================
#  PUBLICAR LA BASE Y LAS EDGE FUNCTIONS EN SUPABASE  (con un boton)
# ============================================================================
#
#  Aplica las migraciones nuevas (`supabase/migrations`) y sube las Edge
#  Functions al proyecto elegido: PRUEBAS o PRODUCCION (CLAUDE.md 13.3: nunca
#  se prueba contra produccion; primero pruebas, luego produccion).
#
#  Se corre A MANO: Actions -> "Publicar en Supabase" -> Run workflow -> elegir
#  el proyecto. Nunca se corre solo, a proposito: cambiar la base de
#  produccion es una decision, no un efecto secundario de subir codigo.
#
#  NUNCA aplica `seed.sql` (los datos de demostracion): `db push` solo aplica
#  migraciones.
#
#  NECESITA estos secretos (Settings -> Secrets and variables -> Actions):
#
#    SUPABASE_ACCESS_TOKEN        supabase.com -> Account -> Access Tokens
#    SUPABASE_REF_PRUEBAS         el "Reference ID" del proyecto de pruebas
#    SUPABASE_PASSWORD_PRUEBAS    la contrasena de la base de pruebas
#    SUPABASE_REF_PRODUCCION      igual, del de produccion
#    SUPABASE_PASSWORD_PRODUCCION
#
#  (Reference ID: Supabase -> Project Settings -> General.)

name: Publicar en Supabase

on:
  workflow_dispatch:
    inputs:
      proyecto:
        description: '¿A cuál proyecto?'
        required: true
        default: pruebas
        type: choice
        options:
          - pruebas
          - produccion

permissions:
  contents: read

jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Elegir credenciales
        id: cred
        run: |
          if [ "${{ inputs.proyecto }}" = "produccion" ]; then
            echo "ref=${{ secrets.SUPABASE_REF_PRODUCCION }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=${{ secrets.SUPABASE_REF_PRUEBAS }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Conectar con el proyecto
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ inputs.proyecto == 'produccion' && secrets.SUPABASE_PASSWORD_PRODUCCION || secrets.SUPABASE_PASSWORD_PRUEBAS }}
        run: |
          if [ -z "${{ steps.cred.outputs.ref }}" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Faltan secretos para '${{ inputs.proyecto }}'. Ver el encabezado de este archivo."
            exit 1
          fi
          supabase link --project-ref "${{ steps.cred.outputs.ref }}" --password "$SUPABASE_DB_PASSWORD"

      - name: Aplicar migraciones nuevas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ inputs.proyecto == 'produccion' && secrets.SUPABASE_PASSWORD_PRODUCCION || secrets.SUPABASE_PASSWORD_PRUEBAS }}
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"

      - name: Subir las Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # Cada funcion lee su verify_jwt de supabase/config.toml.
          for funcion in enrolar-kiosco recibir-registros catalogo latido administradores; do
            supabase functions deploy "$funcion" --project-ref "${{ steps.cred.outputs.ref }}"
          done

      - name: Resumen
        run: echo "Listo: migraciones y funciones publicadas en ${{ inputs.proyecto }}." >> "$GITHUB_STEP_SUMMARY"
